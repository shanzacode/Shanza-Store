<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shanza's Global Finds | AliExpress Store</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <!-- Professional Navbar -->
    <header class="navbar">
        <div class="logo-container" onclick="goHome()">
            <div class="logo-badge"><i class="fa-solid fa-gem"></i></div>
            <div class="logo-text">Shanza's <span>Global Finds</span></div>
        </div>
        
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search products..." onkeyup="searchProducts()">
            <i class="fa-solid fa-magnifying-glass"></i>
        </div>

        <div class="nav-actions">
            <button id="manage-btn" class="add-toggle-btn hidden-secure" onclick="toggleAdminPanel()">
                <i class="fa-solid fa-sliders"></i> Admin Dashboard
            </button>
        </div>
    </header>

    <!-- Secured Admin Panel (Hidden from Clients) -->
    <section id="admin-panel" class="admin-panel hidden">
        <div class="admin-wrapper">
            <!-- Box 1: Add Category -->
            <div class="admin-card">
                <h2><i class="fa-solid fa-folder-plus"></i> Manage Categories</h2>
                <form id="category-form" onsubmit="addNewCategory(event)">
                    <div class="form-group">
                        <label>New Category Name:</label>
                        <input type="text" id="new-cat-name" placeholder="e.g., Jewelry, Fashion..." required>
                    </div>
                    <button type="submit" class="submit-btn secondary-btn">Add Category</button>
                </form>
            </div>

            <!-- Box 2: Add Product from PC with Multiple Images & Sale Option -->
            <div class="admin-card">
                <h2><i class="fa-solid fa-box-open"></i> Add New Product</h2>
                <form id="product-form" onsubmit="addNewProduct(event)">
                    <div class="form-group">
                        <label>Product Title:</label>
                        <input type="text" id="p-title" placeholder="Product name..." required>
                    </div>
                    <div class="form-group">
                        <label>Select Category:</label>
                        <select id="p-category" required></select>
                    </div>
                    <div class="form-group">
                        <label>Price (e.g., Rs. 1,299 or $9.99):</label>
                        <input type="text" id="p-price" placeholder="Rs. 1,299" required>
                    </div>
                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="p-sale">
                        <label for="p-sale">Mark this product <strong>ON SALE</strong> (Shows SALE badge)</label>
                    </div>
                    <div class="form-group">
                        <label>Select Images from PC (Choose 1 to 5 images):</label>
                        <input type="file" id="p-image-files" accept="image/*" multiple required>
                        <small style="color:#666; font-size:11px;">Ctrl daba kar PC se 3-5 images ek sath select kar sakti hain.</small>
                    </div>
                    <div class="form-group">
                        <label>Product Description:</label>
                        <textarea id="p-desc" rows="2" placeholder="Write product details..." required></textarea>
                    </div>
                    <div class="form-group">
                        <label>AliExpress Affiliate Link:</label>
                        <input type="url" id="p-link" placeholder="https://s.click.aliexpress.com/e/..." required>
                    </div>
                    <button type="submit" class="submit-btn">Publish Product</button>
                </form>
            </div>
        </div>
    </section>

    <!-- Dynamic Category Filter Bar -->
    <nav id="category-bar" class="categories"></nav>

    <!-- Main Dynamic View Area -->
    <main id="main-content-area">
        <div id="product-grid" class="product-grid"></div>
        <div id="empty-state" class="empty-state">
            <i class="fa-solid fa-bag-shopping"></i>
            <p>Loading products...</p>
        </div>
    </main>

    <!-- Professional Footer -->
    <footer class="site-footer">
        <div class="footer-content">
            <p>&copy; 2026 <strong>Shanza's Global Finds</strong>. All rights reserved.</p>
            <p class="footer-sub">Official AliExpress Affiliate Partner | Handpicked Quality Finds</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
