<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shanza's Global Finds | Affiliate Store</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <!-- Shein-Style Modern Navbar -->
    <header class="navbar">
        <div class="nav-container">
            <!-- Logo (3 clicks opens Admin) -->
            <div class="logo-container" onclick="goHome()" title="Home">
                <svg class="brand-bag-logo" width="36" height="36" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="2" y="2" width="44" height="44" rx="12" fill="#111827"/>
                    <path d="M18 17V13.5C18 10.1863 20.6863 7.5 24 7.5C27.3137 7.5 30 10.1863 30 13.5V17" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>
                    <path d="M12.5 17H35.5L37.5 36.5C37.7 38.4 36.2 40 34.3 40H13.7C11.8 40 10.3 38.4 10.5 36.5L12.5 17Z" fill="#F44349"/>
                    <path d="M24 24.5L25.4 28.1L29 29.5L25.4 30.9L24 34.5L22.6 30.9L19 29.5L22.6 28.1L24 24.5Z" fill="#FDE047"/>
                </svg>
            </div>

            <!-- Search Bar (Fixed for Mobile & Vivo Screens) -->
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Search products..." onkeyup="searchProducts()">
                <button class="search-btn-icon"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>

            <!-- Admin Button -->
            <div class="nav-actions">
                <button id="manage-btn" class="add-toggle-btn hidden-secure" onclick="toggleAdminPanel()">
                    <i class="fa-solid fa-sliders"></i> Admin
                </button>
            </div>
        </div>
    </header>

    <!-- Horizontal Smooth Scrolling Categories Bar -->
    <nav class="shein-cat-nav">
        <div class="cat-scroll-container" id="category-bar">
            <!-- Categories loaded dynamically -->
        </div>
    </nav>

    <!-- Secured Admin Panel -->
    <section id="admin-panel" class="admin-panel hidden">
        <div class="admin-wrapper">
            <div class="admin-card">
                <h2><i class="fa-solid fa-folder-plus"></i> Manage Categories</h2>
                <form id="category-form" onsubmit="addNewCategory(event)">
                    <div class="form-group">
                        <label>New Category Name:</label>
                        <input type="text" id="new-cat-name" placeholder="e.g., Jewelry, Bags..." required>
                    </div>
                    <button type="submit" class="submit-btn secondary-btn">Add Category</button>
                </form>
            </div>

            <div class="admin-card">
                <h2><i class="fa-solid fa-box-open"></i> Add New Product</h2>
                <form id="product-form" onsubmit="addNewProduct(event)">
                    <div class="form-group">
                        <label>Product Title:</label>
                        <input type="text" id="p-title" placeholder="Product name..." required>
                    </div>
                    <div class="form-group">
                        <label>Select Category:</label>
                        <select id="p-category" required></select>
                    </div>
                    <div class="form-group">
                        <label>Price:</label>
                        <input type="text" id="p-price" placeholder="Rs. 1,299" required>
                    </div>
                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="p-sale">
                        <label for="p-sale">Mark this product <strong>ON SALE</strong></label>
                    </div>
                    <div class="form-group">
                        <label>Select Images from PC (1 to 5 images):</label>
                        <input type="file" id="p-image-files" accept="image/*" multiple required>
                    </div>
                    <div class="form-group">
                        <label>Product Description:</label>
                        <textarea id="p-desc" rows="2" placeholder="Write product details..." required></textarea>
                    </div>
                    <div class="form-group">
                        <label>AliExpress Affiliate Link:</label>
                        <input type="url" id="p-link" placeholder="https://s.click.aliexpress.com/e/..." required>
                    </div>
                    <button type="submit" class="submit-btn">Publish Product</button>
                </form>
            </div>
        </div>
    </section>

    <!-- Main View Area -->
    <main id="main-content-area">
        <div id="product-grid" class="product-grid"></div>
        <div id="empty-state" class="empty-state">
            <i class="fa-solid fa-bag-shopping"></i>
            <p>Loading products...</p>
        </div>
    </main>

    <!-- Simple Footer -->
    <footer class="site-footer">
        <div class="footer-container">
            <p>&copy; 2026 Shanza's Global Finds. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
